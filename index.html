<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIPEX LAG | Key Generator</title>

<style>

:root {
    --bg: #000000;
    --card: #121212;
    --text: #ffffff;
    --accent: #00ff88;
    --gray: #777777;
    --border: #292929;
    --telegram: #0088cc;
    --error: #ff4444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
}

.container {
    width: 100%;
    max-width: 430px;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 35px 25px;

    text-align: center;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.7);
}


/* =========================================
   LOGO
========================================= */

.logo {
    width: 90px;
    height: 90px;

    margin: 0 auto 20px;

    border-radius: 50%;
    overflow: hidden;

    border: 2px solid var(--accent);

    box-shadow:
        0 0 30px
        rgba(0,255,136,0.15);
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}


/* =========================================
   TITLE
========================================= */

h1 {
    margin: 0;

    font-size: 28px;
    font-weight: 800;
}

.subtitle {
    color: var(--gray);

    font-size: 14px;

    margin-top: 8px;
    margin-bottom: 30px;
}


/* =========================================
   IP
========================================= */

.ip-title {
    color: var(--gray);

    font-size: 12px;

    letter-spacing: 1px;

    margin-bottom: 8px;
}

#ipAddress {
    color: var(--accent);

    font-family:
        "Courier New",
        monospace;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 25px;
}


/* =========================================
   KEY
========================================= */

.key-title {
    color: var(--gray);

    font-size: 12px;

    letter-spacing: 1px;

    margin-bottom: 10px;
}

.key-box {
    background: #000000;

    border: 1px dashed var(--accent);

    border-radius: 18px;

    padding: 22px 10px;

    margin-bottom: 20px;

    overflow: hidden;
}

#finalKey {
    color: var(--accent);

    font-family:
        "Courier New",
        monospace;

    font-size: 18px;

    font-weight: bold;

    letter-spacing: 1px;

    word-break: break-all;
}


/* =========================================
   BUTTON
========================================= */

.btn {
    width: 100%;

    padding: 17px;

    border: none;

    border-radius: 16px;

    background: #ffffff;

    color: #000000;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    margin-top: 10px;

    transition: 0.2s;
}

.btn:hover {
    transform: scale(1.02);
    background: var(--accent);
}

.btn:active {
    transform: scale(0.98);
}


/* =========================================
   TELEGRAM
========================================= */

.telegram {
    background: var(--telegram);
    color: #ffffff;
}

.telegram:hover {
    background: #00aaff;
}


/* =========================================
   STATUS
========================================= */

.status {
    margin-top: 25px;

    color: var(--gray);

    font-size: 13px;
}


/* =========================================
   ERROR
========================================= */

#error {
    display: none;

    color: var(--error);

    margin-top: 20px;

    font-size: 14px;

    line-height: 1.5;
}


/* =========================================
   FOOTER
========================================= */

.footer {
    margin-top: 25px;

    color: #333333;

    font-size: 10px;

    letter-spacing: 2px;

    font-weight: bold;

    text-align: center;
}

</style>

</head>


<body>


<div class="container">

    <div class="card">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="./assets/logo.png"
                alt="NIPEX">

        </div>


        <!-- TITLE -->

        <h1>
            NIPEX LAG
        </h1>


        <div class="subtitle">
            Secure Daily License Generator
        </div>


        <!-- PUBLIC IP -->

        <div class="ip-title">
            YOUR PUBLIC IP
        </div>


        <div id="ipAddress">
            CONNECTING...
        </div>


        <!-- LICENSE KEY -->

        <div class="key-title">
            YOUR LICENSE KEY
        </div>


        <div class="key-box">

            <span id="finalKey">
                SECURE FETCHING...
            </span>

        </div>


        <!-- COPY -->

        <button
            class="btn"
            id="copyBtn"
            onclick="copyKey()">

            COPY LICENSE KEY

        </button>


        <!-- TELEGRAM -->

        <button
            class="btn telegram"
            onclick="openTelegram()">

            JOIN TELEGRAM

        </button>


        <!-- STATUS -->

        <div
            id="status"
            class="status">

            SYSTEM: CONNECTING

        </div>


        <!-- ERROR -->

        <div id="error">

            Unable to connect to IP service.
            Please check your internet connection.

        </div>


    </div>


    <!-- FOOTER -->

    <div class="footer">

        NIPEX LAG SECURITY SYSTEM

    </div>

</div>



<script>


/* =========================================
   CONFIG
========================================= */

const IP_API =
    "https://api.ipify.org?format=json";


/*
 * YOUR TELEGRAM CHANNEL
 */

const TELEGRAM_LINK =
    "https://t.me/nipex_lag";


/*
 * Same year as Android
 */

const KEY_YEAR =
    2026;



/* =========================================
   GET PUBLIC IP
========================================= */

async function getPublicIP() {

    const response =
        await fetch(
            IP_API,
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "IP request failed"
        );

    }


    const data =
        await response.json();


    if (!data.ip) {

        throw new Error(
            "IP not found"
        );

    }


    return data.ip;

}



/* =========================================
   GENERATE KEY
========================================= */

function generateKeyFromIP(ip) {


    /*
     * Current day
     */

    const day =
        Math.floor(
            Date.now() / 86400000
        );


    /*
     * Remove dots
     */

    let cleanIP =
        ip.replace(
            /\./g,
            ""
        );


    /*
     * First 6 digits
     */

    if (
        cleanIP.length > 6
    ) {

        cleanIP =
            cleanIP.substring(
                0,
                6
            );

    }


    /*
     * IP seed
     */

    const ipSeed =
        parseInt(
            cleanIP,
            10
        );


    /*
     * Final seed
     */

    let seed =
        ipSeed +
        day +
        KEY_YEAR;


    /*
     * Characters
     */

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    /*
     * Key start
     */

    let finalKey =
        "NIPEX-";


    /*
     * Four groups
     */

    for (
        let i = 0;
        i < 4;
        i++
    ) {


        if (i > 0) {

            finalKey += "-";

        }


        /*
         * Four characters
         */

        for (
            let j = 0;
            j < 4;
            j++
        ) {


            const x =
                Math.sin(
                    seed++
                ) * 10000;


            const random =
                Math.abs(
                    x -
                    Math.floor(x)
                );


            const index =
                Math.floor(
                    random *
                    chars.length
                );


            finalKey +=
                chars.charAt(
                    index
                );

        }

    }


    return finalKey;

}



/* =========================================
   AUTOMATIC GENERATION
========================================= */

async function generateLockedKey() {


    const keyElement =
        document.getElementById(
            "finalKey"
        );


    const ipElement =
        document.getElementById(
            "ipAddress"
        );


    const statusElement =
        document.getElementById(
            "status"
        );


    const errorElement =
        document.getElementById(
            "error"
        );


    keyElement.innerText =
        "SECURE FETCHING...";


    ipElement.innerText =
        "CONNECTING...";


    statusElement.innerText =
        "SYSTEM: GETTING IP";


    errorElement.style.display =
        "none";


    try {


        /*
         * Get public IP
         */

        const ip =
            await getPublicIP();


        /*
         * Display IP
         */

        ipElement.innerText =
            ip;


        /*
         * Generate daily key
         */

        const key =
            generateKeyFromIP(
                ip
            );


        /*
         * Display key
         */

        keyElement.innerText =
            key;


        statusElement.innerText =
            "SYSTEM: NIPEX LAG";


    }
    catch (error) {


        console.error(
            error
        );


        ipElement.innerText =
            "UNAVAILABLE";


        keyElement.innerText =
            "CONNECT TO INTERNET";


        statusElement.innerText =
            "SYSTEM: OFFLINE";


        errorElement.style.display =
            "block";

    }

}



/* =========================================
   COPY
========================================= */

async function copyKey() {


    const key =
        document
            .getElementById(
                "finalKey"
            )
            .innerText;


    if (
        key.includes("SECURE") ||
        key.includes("CONNECT")
    ) {

        return;

    }


    try {


        await navigator
            .clipboard
            .writeText(
                key
            );


        const button =
            document.getElementById(
                "copyBtn"
            );


        button.innerText =
            "COPIED SUCCESSFULLY! ✓";


        button.style.background =
            "#00ff88";


        setTimeout(
            function() {


                button.innerText =
                    "COPY LICENSE KEY";


                button.style.background =
                    "#ffffff";


            },
            2000
        );


    }
    catch (error) {


        alert(
            "Copy failed. Please copy the key manually."
        );

    }

}



/* =========================================
   TELEGRAM CHANNEL
========================================= */

function openTelegram() {

    window.location.href =
        "https://t.me/nipex_lag";

}



/* =========================================
   START AUTOMATICALLY
========================================= */

window.addEventListener(
    "load",
    function() {

        /*
         * Website open hote hi
         * IP detect hoga aur
         * key automatically generate hogi.
         */

        generateLockedKey();

    }
);

</script>

</body>

</html>
